r, </text><text data-member="method" x="2332" y="287" font-size="14.5" >  datetime]</text><text data-member="method" x="2332" y="309" font-size="14.5" >+logout(employee_id) : None</text></g></g><g transform="translate(-1500 -300)"><g data-class="Employee" data-kind="entity" data-x="2320" data-y="420" data-w="420" data-h="320"><rect x="2320" y="420" width="420" height="320" fill="white" stroke="#777"/><rect x="2320" y="420" width="420" height="62" fill="#ECECEC" stroke="#777"/><circle cx="2343" cy="442" r="10" fill="#D5E6D6" stroke="#708E74"/><text x="2343" y="447" text-anchor="middle" font-size="13" font-weight="700">C</text><text x="2530" y="444" text-anchor="middle" font-size="17" font-weight="700">員工</text><text x="2530" y="467" text-anchor="middle" font-size="14">Employee　<tspan font-size="11" font-style="italic">«entity»</tspan></text><text data-member="attribute" x="2332" y="502" font-size="15">+id : int</text><text data-member="attribute" x="2332" y="524" font-size="15">+username : str</text><text data-member="attribute" x="2332" y="546" font-size="15">+password_hash : str</text><text data-member="attribute" x="2332" y="568" font-size="15">+name : str</text><text data-member="attribute" x="2332" y="590" font-size="15">+role : EmployeeRole</text><text data-member="attribute" x="2332" y="612" font-size="15">+is_active : bool</text><text data-member="attribute" x="2332" y="634" font-size="15">+token_version : int</text><text data-member="attribute" x="2332" y="656" font-size="15">+created_at : datetime</text><line x1="2320" y1="669" x2="2740" y2="669" stroke="#777"/><text data-member="method" x="2332" y="693" font-size="14.5" >—</text></g></g><g data-label="d258"><rect x="680" y="225" width="50" height="22" fill="white"/><text x="705" y="241.25" font-size="15" text-anchor="middle">«use»</text></g><text x="40" y="562" font-size="15">實線：領域關聯及多重度；虛線：使用依賴；交叉不表示關聯。</text><text x="40" y="589" font-size="15">選入類別保留總圖的全部屬性與核心方法；跨視圖關聯請參照完整圖。</text><text x="40" y="616" fo