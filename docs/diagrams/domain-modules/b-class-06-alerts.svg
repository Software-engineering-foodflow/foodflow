" y="1079.069" fill="#000" font-size="17.5" textLength="367.5" font-family="Microsoft JhengHei">預警由設定、食材安全庫存量與批次效期計算。</text><text x="28.75" y="1102.345" fill="#000" font-size="17.5" textLength="351.658" font-family="Microsoft JhengHei">AlertSetting 與 Ingredient／InventoryBatch</text><text x="28.75" y="1125.621" fill="#000" font-size="17.5" textLength="385" font-family="Microsoft JhengHei">沒有直接資料關聯，不以虛構連線表示計算依賴。</text><text x="28.75" y="1148.898" fill="#000" font-size="17.5" textLength="260.372" font-family="Microsoft JhengHei">─────────────────────</text><text x="28.75" y="1172.174" fill="#000" font-size="17.5" textLength="364.449" font-family="Microsoft JhengHei">+ 公開屬性；/ 衍生唯讀屬性；T | None 可為空</text><text x="28.75" y="1195.45" fill="#000" font-size="17.5" textLength="385" font-family="Microsoft JhengHei">端點數字為原圖多重度；交叉處不代表關聯或分支</text><text x="28.75" y="1218.727" fill="#000" font-size="17.5" textLength="367.5" font-family="Microsoft JhengHei">共用類別可出現在不同模組圖；屬性均完整保留</text></g><g class="caption" data-source-line="2"><text x="430.272" y="1280.753" fill="#000" font-size="17.5" textLength="394.023" font-family="Microsoft JhengHei">FR-12～FR-14｜局部視圖，完整關聯見原始總覽圖</text></g><?plantuml-src fLLRJnj757xVNp5otbgH0kAIeWW96gocKlCGybOgQxmxs2FMCzlPCIvfApbfgOsu6BN6130u5ZTN0ImQgb07ql_IU7RNJ_o5pkuQl4kIKgcI9U-SS-QSxplppHoEkOv0QxiY6WKGfLIBwZHpSLwsLl9MkUBaSytp9T5u8GwVjPulEuTxhUVFHANIgcw9_AuebnGL6XnJ0g8FktfwBywttFy-kLySPri_rfozaWowE5iGHmlMoabhjUmygJjxysAf8lRdxTDpP-_SpQAZIGuu1GmdaXnec27LpQeaiOQ0Yfcg8yMSmiI03AQ0ZWdYCmO21jLdt4N05uVgL8BHDD4-epfb89F4FEWtar2Z6KmIO1BgPj2ZeKcOrdcK4lu0fX3u4gkCcbG2-oA9IE9pXDyVF8uV8z3J5t2gEZJD4SuPZgSvkgzIuiLqNmyPfKn3pCTvQw1liE_EQ21aX36QQJlx1llx1pwzxknKxmsu2DMGYGpGtnymCaYcN6DFTn250JNDRSL0a9c1PRvkHV4WWeZujIfUxKwGiPIXqnc48W2Qu781xjv5X6C-CpmCRaLxnwBHE-0x1O2FiGQ602RS_KwRY16teqF0vCor639pHfAF9Q6Px9Z3GOpgxkgor4Evz3ARCIZ5CUtwufJghetJAKHYquYPhXIl2giCGOwq6EJIfibFZbD8-U6AcgzeftOeZjOdo8YE61z7dCkEU2I3Xlz4D8m_0ncHEsCQd35lmkHsoT3-tH6VYLqM0z-31vI4g6nNhCtb2NAV91ZIiCJgKUWiGmGa_85ez2O2gYoReAnJ