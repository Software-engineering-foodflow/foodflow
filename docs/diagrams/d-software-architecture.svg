<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2145" viewBox="0 0 1660 2145" role="img" aria-label="FoodFlow 軟體架構圖"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" fill="#1F2937"><text x="830" y="49" font-size="32" font-weight="700" text-anchor="middle">食序 FoodFlow｜軟體架構圖</text><g data-id="Frontend"><rect x="390" y="175" width="880" height="190" rx="10" fill="#EAF3ED" stroke="#64748B" stroke-width="1.5"/><text x="410" y="206" font-size="22" font-weight="700" text-anchor="start">前端客戶端層（電腦／平板瀏覽器）</text></g><g data-id="Backend"><rect x="40" y="405" width="1580" height="1285" rx="10" fill="#F5F8FC" stroke="#64748B" stroke-width="1.5"/><text x="60" y="436" font-size="22" font-weight="700" text-anchor="start">FastAPI 後端應用｜單一應用、依功能模組分層</text></g><polyline data-edge="e1" points="830,144 830,175" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e2" points="830,340 830,475" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e3" points="830,625 830,715" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e4" points="440,790 410,790" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e5" points="440,850 425,850 425,1017 410,1017" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e6" points="1220,797 1250,797" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><polyline data-edge="e7" points="1220,870 1235,870 1235,1015 1250,1015" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e8" points="620,925 620,1040 565,1040 565,1175" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e9" points="1040,925 1040,1040 1065,1040 1065,1175" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e10" points="565,1365 565,1435 650,1435 650,1500" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e11" points="1065,1365 1065,1435 1010,1435 1010,1500" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e12" points="1590,1015 1603,1015 1603,1567 1220,1567" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><polyline data-edge="e13" points="830,1635 830,1780" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><g data-id="User" data-x="530" data-y="90" data-width="600" data-height="54"><rect x="530" y="90" width="600" height="54" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/><text x="830" y="124.92" font-size="22" font-weight="700" text-anchor="middle">餐廳操作人員：管理者／一般員工</text></g><g data-id="Web" data-x="410" data-y="218" data-width="840" data-height="122"><rect x="410" y="218" width="840" height="122" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/><text x="830" y="255.2" font-size="20" font-weight="700" text-anchor="middle">React＋TypeScript＋Vite／Mantine</text><text x="830" y="286.2" font-size="20" font-weight="400" text-anchor="middle">頁面與表單 → TanStack Query hooks → feature API</text><text x="830" y="317.2" font-size="20" font-weight="400" text-anchor="middle">shared/api/client.ts 統一請求與錯誤處理</text></g><g data-id="Api" data-x="440" data-y="475" data-width="780" data-height="150"><rect x="440" y="475" width="780" height="150" rx="8" fill="#E8EFF9" stroke="#64748B" stroke-width="1.4"/><text x="830" y="510.7" font-size="20" font-weight="700" text-anchor="middle">API 入口與安全控管</text><text x="830" y="541.7" font-size="20" font-weight="400" text-anchor="middle">/api/v1・router.py／Pydantic schemas</text><text x="830" y="572.7" font-size="20" font-weight="400" text-anchor="middle">JWT Cookie 驗證・角色權限（RBAC）</text><text x="830" y="603.7" font-size="20" font-weight="400" text-anchor="middle">統一錯誤回應（DomainError／驗證錯誤）</text></g><g data-id="Service" data-x="440" data-y="715" data-width="780" data-height="210"><rect x="440" y="715" width="780" height="210" rx="8" fill="#EAF3ED" stroke="#64748B" stroke-width="1.4"/><text x="830" y="765.2" font-size="20" font-weight="700" text-anchor="middle">Service 商業邏輯層</text><text x="830" y="796.2" font-size="20" font-weight="400" text-anchor="middle">帳號權限｜基本資料與儲存位置</text><text x="830" y="827.2" font-size="20" font-weight="400" text-anchor="middle">進貨與批次｜批次庫存查詢</text><text x="830" y="858.2" font-size="20" font-weight="400" text-anchor="middle">食材領用｜效期與低庫存預警</text><text x="830" y="889.2" font-size="20" font-weight="400" text-anchor="middle">報廢與盤點｜異動紀錄與統計</text></g><g data-id="Domain" data-x="70" data-y="695" data-width="340" data-height="190"><rect x="70" y="695" width="340" height="190" rx="8" fill="#FFF7E8" stroke="#64748B" stroke-width="1.4"/><text x="240" y="750.7" font-size="20" font-weight="700" text-anchor="middle">領域規則與策略</text><text x="240" y="781.7" font-size="20" font-weight="400" text-anchor="middle">FefoStrategy／ManualStrategy</text><text x="240" y="812.7" font-size="20" font-weight="400" text-anchor="middle">AlertRuleFactory／AlertRule</text><text x="240" y="843.7" font-size="20" font-weight="400" text-anchor="middle">共用效期與低庫存判定</text></g><g data-id="Notifier" data-x="70" data-y="945" data-width="340" data-height="145"><rect x="70" y="945" width="340" height="145" rx="8" fill="#FFF7E8" stroke="#64748B" stroke-width="1.4"/><text x="240" y="978.2" font-size="20" font-weight="700" text-anchor="middle">站內預警 Adapter</text><text x="240" y="1009.2" font-size="20" font-weight="400" text-anchor="middle">AlertNotifier → InAppNotifier</text><text x="240" y="1040.2" font-size="20" font-weight="400" text-anchor="middle">同步回傳 AlertResult</text><text x=