nt-weight="400" text-anchor="middle">各模組介面＋SQLAlchemy 實作</text><text x="1065" y="1292.7" font-size="20" font-weight="400" text-anchor="middle">基本資料及單據查詢與維護</text><text x="1065" y="1323.7" font-size="20" font-weight="400" text-anchor="middle">批次查詢、預警資料與統計</text></g><g data-id="Session" data-x="440" data-y="1500" data-width="780" data-height="135"><rect x="440" y="1500" width="780" height="135" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/><text x="830" y="1543.7" font-size="20" font-weight="700" text-anchor="middle">SQLAlchemy Session／ORM</text><text x="830" y="1574.7" font-size="20" font-weight="400" text-anchor="middle">共用資料庫連線與模型</text><text x="830" y="1605.7" font-size="20" font-weight="400" text-anchor="middle">資料存取 flush；交易由 UnitOfWork 管理</text></g><g data-id="Db" data-x="440" data-y="1780" data-width="780" data-height="170"><path d="M440,1798 C440,1775 1220,1775 1220,1798 L1220,1932 C1220,1955 440,1955 440,1932 Z" fill="#EAF3ED" stroke="#64748B" stroke-width="1.5"/><path d="M440,1798 C440,1822 1220,1822 1220,1798" fill="none" stroke="#64748B"/><text x="830" y="1835.7" font-size="20" font-weight="700" text-anchor="middle">PostgreSQL 17</text><text x="830" y="1866.7" font-size="20" font-weight="400" text-anchor="middle">12 張表・PK／FK／唯一及檢查限制</text><text x="830" y="1897.7" font-size="20" font-weight="400" text-anchor="middle">批次、單據、庫存異動、位置及報廢紀錄</text><text x="830" y="1928.7" font-size="20" font-weight="400" text-anchor="middle">Docker Compose＋持久化 Volume</text></g><g data-edge-label="e2"><text x="1040" y="425" font-size="18" font-weight="400" text-anchor="middle">同源 HTTP／JSON・/api/v1</text><text x="1040" y="452" font-size="18" font-weight="400" text-anchor="middle">JWT 以 HttpOnly Cookie 傳遞</text></g><g data-edge-label="e3"><text x="940" y="673" font-size="18" font-weight="400" text-anchor="middle">驗證後呼叫</text></g><g data-edge-label="e8"><text x="640" y="1080" font-size="18" font-weight="400" text-anchor="middle">庫存變更</text></g><g data-edge-label="e9"><t